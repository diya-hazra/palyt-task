<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Palyt - Kitchen Stock &amp; Menu</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 20px; color: #222; }
  h1 { font-size: 20px; }
  h2 { font-size: 16px; }
  .columns { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
  .column { flex: 1; min-width: 380px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 12px; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; font-size: 14px; }
  th { background: #f2f2f2; }
  tr.below-par td { background: #fdecea; }
  tr.unavailable td { color: #999; }
  button { cursor: pointer; }
  .row-actions button { margin-right: 4px; }
  #ingredientForm { border: 1px solid #ccc; padding: 12px; margin-bottom: 16px; }
  #ingredientForm label { display: block; margin-bottom: 6px; font-size: 14px; }
  #ingredientForm input, #ingredientForm select { width: 100%; box-sizing: border-box; padding: 4px; }
  .errors { color: #b00020; font-size: 13px; margin: 6px 0; }
  .menu-item { border: 1px solid #ccc; padding: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .menu-item.unavailable { opacity: 0.55; }
  .price { color: #555; }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 3px; }
  .tag.out { background: #fdecea; color: #b00020; }
  .tag.in { background: #e6f4ea; color: #1e7e34; }
  #searchBox { margin-bottom: 10px; padding: 4px; width: 250px; }
  .note { font-size: 12px; color: #666; }
</style>
</head>
<body>

<h1>Palyt - Kitchen</h1>
<p class="note">Stock on the left. What the diner sees on the right. Order a dish and watch both update.</p>

<div class="columns">

  <div class="column">
    <h2>Stock</h2>
    <input id="searchBox" type="text" placeholder="Search ingredients...">

    <div id="ingredientForm" style="display:none;">
      <div class="errors" id="formErrors"></div>
      <label>Name <input id="fName" type="text"></label>
      <label>Quantity <input id="fQty" type="number" step="any"></label>
      <label>Unit
        <select id="fUnit">
          <option value="kg">kg</option>
          <option value="g">g</option>
          <option value="l">l</option>
          <option value="ml">ml</option>
          <option value="piece">piece</option>
        </select>
      </label>
      <label>Par level <input id="fPar" type="number" step="any"></label>
      <button id="saveIngredientBtn">Save</button>
      <button id="cancelFormBtn">Cancel</button>
    </div>
    <button id="addIngredientBtn">+ Add ingredient</button>

    <table>
      <thead>
        <tr><th>Ingredient</th><th>Qty</th><th>Par</th><th></th></tr>
      </thead>
      <tbody id="stockTableBody"></tbody>
    </table>
  </div>

  <div class="column">
    <h2>Menu (diner view)</h2>
    <div id="menuList"></div>
  </div>

</div>

<script src="src/logic.js"></script>
<script>
const {
  getMenuWithAvailability,
  deductStockForOrder,
  canDeleteIngredient,
  deleteIngredient,
  validateIngredient,
} = window.PalytLogic;

let stock = [];
let recipes = [];
let editingId = null; // ingredient currently being edited, or null when adding

async function loadData() {
  const [stockRes, recipesRes] = await Promise.all([
    fetch('data/stock.json'),
    fetch('data/recipes.json'),
  ]);
  stock = await stockRes.json();
  recipes = await recipesRes.json();
}

function render() {
  renderStockTable();
  renderMenu();
}

function renderStockTable() {
  const query = document.getElementById('searchBox').value.trim().toLowerCase();
  const tbody = document.getElementById('stockTableBody');
  tbody.innerHTML = '';

  stock
    .filter((item) => item.name.toLowerCase().includes(query))
    .forEach((item) => {
      const belowPar = toComparable(item.quantity, item.unit) < toComparable(item.par, item.unit);
      const tr = document.createElement('tr');
      if (belowPar) tr.className = 'below-par';

      tr.innerHTML = `
        <td>${escapeHtml(item.name)}</td>
        <td>${item.quantity} ${item.unit}</td>
        <td>${item.par} ${item.unit}</td>
        <td class="row-actions">
          <button data-edit="${item.id}">Edit</button>
          <button data-delete="${item.id}">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

  tbody.querySelectorAll('[data-edit]').forEach((btn) =>
    btn.addEventListener('click', () => openForm(btn.dataset.edit))
  );
  tbody.querySelectorAll('[data-delete]').forEach((btn) =>
    btn.addEventListener('click', () => handleDelete(btn.dataset.delete))
  );
}

// convert to same base unit just for the below-par row highlight (kg/l -> *1000)
function toComparable(amount, unit) {
  return (unit === 'kg' || unit === 'l') ? amount * 1000 : amount;
}

function renderMenu() {
  const menu = getMenuWithAvailability(recipes, stock);
  const container = document.getElementById('menuList');
  container.innerHTML = '';

  menu.forEach((dish) => {
    const div = document.createElement('div');
    div.className = 'menu-item' + (dish.available ? '' : ' unavailable');
    div.innerHTML = `
      <div>
        <strong>${escapeHtml(dish.name)}</strong>
        <span class="price">Rs ${dish.price}</span>
        <span class="tag ${dish.available ? 'in' : 'out'}">
          ${dish.available ? 'Available' : 'Not available'}
        </span>
      </div>
      <button ${dish.available ? '' : 'disabled'} data-order="${dish.id}">Order</button>
    `;
    container.appendChild(div);
  });

  container.querySelectorAll('[data-order]').forEach((btn) =>
    btn.addEventListener('click', () => handleOrder(btn.dataset.order))
  );
}

function handleOrder(dishId) {
  const dish = recipes.find((d) => d.id === dishId);
  try {
    stock = deductStockForOrder(dish, stock);
    render();
  } catch (err) {
    alert(err.message);
  }
}

function openForm(ingredientId) {
  editingId = ingredientId || null;
  const form = document.getElementById('ingredientForm');
  form.style.display = 'block';
  document.getElementById('formErrors').textContent = '';

  if (editingId) {
    const item = stock.find((s) => s.id === editingId);
    document.getElementById('fName').value = item.name;
    document.getElementById('fQty').value = item.quantity;
    document.getElementById('fUnit').value = item.unit;
    document.getElementById('fPar').value = item.par;
  } else {
    document.getElementById('fName').value = '';
    document.getElementById('fQty').value = '';
    document.getElementById('fUnit').value = 'kg';
    document.getElementById('fPar').value = '';
  }
}

function closeForm() {
  editingId = null;
  document.getElementById('ingredientForm').style.display = 'none';
}

function handleSave() {
  const input = {
    name: document.getElementById('fName').value,
    quantity: parseFloat(document.getElementById('fQty').value),
    unit: document.getElementById('fUnit').value,
    par: parseFloat(document.getElementById('fPar').value),
  };

  const errors = validateIngredient(input, stock, { editingId });
  if (errors.length) {
    document.getElementById('formErrors').textContent = errors.join(' ');
    return;
  }

  if (editingId) {
    stock = stock.map((s) => (s.id === editingId ? { ...s, ...input } : s));
  } else {
    const id = input.name.trim().toLowerCase().replace(/\s+/g, '_');
    stock = [...stock, { id, ...input }];
  }

  closeForm();
  render();
}

function handleDelete(ingredientId) {
  const { canDelete, affectedDishes } = canDeleteIngredient(ingredientId, recipes);

  if (canDelete) {
    stock = stock.filter((s) => s.id !== ingredientId);
    render();
    return;
  }

  const confirmed = confirm(
    `${affectedDishes.join(', ')} use this ingredient. Deleting it will take those dishes ` +
    `off the menu until someone edits the recipe. Delete anyway?`
  );
  if (!confirmed) return;

  const result = deleteIngredient(ingredientId, stock, recipes, { force: true });
  stock = result.stock;
  recipes = result.recipes;
  render();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('addIngredientBtn').addEventListener('click', () => openForm(null));
document.getElementById('cancelFormBtn').addEventListener('click', closeForm);
document.getElementById('saveIngredientBtn').addEventListener('click', handleSave);
document.getElementById('searchBox').addEventListener('input', renderStockTable);

loadData().then(render);
</script>
</body>
</html>
